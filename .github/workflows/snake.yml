# Redraws the snake that eats the contribution graph (used at the bottom of README.md).
# The SVGs are published to the "output" branch; the README links them from there.
name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs (Ubuntu colours)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#E95420&color_dots=#ebedf0,#f9c9b4,#f29a75,#E95420,#77216F
            dist/snake-dark.svg?palette=github-dark&color_snake=#E95420&color_dots=#161b22,#4a1238,#77216F,#B03B48,#E95420

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
